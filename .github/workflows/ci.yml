name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # So a merge queue entry has status checks to wait on.
  merge_group:
    branches:
      - main
  workflow_dispatch:

# Supersede stale runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Foundation has no public olean cache, so it is compiled here once, its warnings — upstream's,
  # not ours — cleared, and handed to `build` through a cache keyed on toolchain and manifest.
  deps:
    name: Build Foundation (cached)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Probed first: on a hit every step below is skipped.
      - name: Cache Foundation build (keyed on toolchain + manifest)
        id: foundation-cache
        uses: actions/cache@v6
        with:
          path: .lake/packages/Foundation/.lake/build
          key: foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      # elan and the mathlib cache only; the Foundation build and its cache are driven above.
      - uses: leanprover/lean-action@v1
        if: steps.foundation-cache.outputs.cache-hit != 'true'
        with:
          build: false
          use-github-cache: false
      # Mathlib's cache leaves the runner's disk 97% full, and the cold Foundation build then fills
      # it and the runner is killed (exit 143) partway through `Foundation.FirstOrder.Arithmetic`.
      # Dropping the preinstalled toolchains we never use buys the tens of gigabytes it needs.
      - name: Free disk space
        if: steps.foundation-cache.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: Build Foundation from source (cache miss only)
        if: steps.foundation-cache.outputs.cache-hit != 'true'
        run: lake build Foundation
      # Lake replays each module's cached diagnostics on every downstream build. Emptying the
      # `log` array of its `.trace` drops the replay without touching the `.olean`.
      - name: Clear Foundation's replayed-warning cache
        if: steps.foundation-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('.lake/packages/Foundation/.lake/build')
          cleared = 0
          for t in root.rglob('*.trace'):
              try:
                  d = json.loads(t.read_text())
              except (ValueError, OSError):
                  continue
              if d.get('log'):
                  d['log'] = []
                  t.write_text(json.dumps(d))
                  cleared += 1
          print(f'cleared warning cache in {cleared} Foundation trace(s)')
          PY

  # Build AlphaCentauri against the cleansed dependency layer from `deps`.
  build:
    name: Build project
    needs: deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the audit comment below
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      # Restore the Foundation build cleansed by `deps` (guaranteed present via `needs: deps`).
      - name: Restore Foundation build (warnings cleared)
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages/Foundation/.lake/build
          key: foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          fail-on-cache-miss: true

      # Our own oleans only. Cache entries are immutable, so the key appends the sha and
      # `restore-keys` falls back to the newest cache built against the same pins.
      - name: Restore project cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .lake/AlphaCentauri-x86_64-unknown-linux-gnu.tar.gz
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Unpack project cache
        if: hashFiles('.lake/AlphaCentauri-x86_64-unknown-linux-gnu.tar.gz') != ''
        run: lake unpack

      # A fallback cache can carry artifacts of modules that have since been renamed or deleted,
      # and `lake build` leaves them alone because no source of theirs changed.
      - name: Prune orphaned build artifacts from renamed/removed sources
        run: |
          python3 - <<'PY'
          import pathlib
          src_root = pathlib.Path('AlphaCentauri')
          for build_root in [pathlib.Path('.lake/build/lib/lean/AlphaCentauri'), pathlib.Path('.lake/build/ir/AlphaCentauri')]:
              if not build_root.exists():
                  continue
              for f in sorted(build_root.rglob('*')):
                  if not f.is_file():
                      continue
                  rel_dir = f.relative_to(build_root).parent
                  base = f.name.split('.', 1)[0]
                  if not (src_root / rel_dir / f'{base}.lean').exists():
                      print(f'removing orphaned artifact {f}')
                      f.unlink()
          PY

      - name: Build AlphaCentauri
        run: lake build AlphaCentauri

      # A failure is deferred to the last step of the job, so that the report still reaches the
      # pull request and the cache below is still saved.
      - name: Audit axioms
        id: audit
        continue-on-error: true
        run: lake exe audit
      # One comment per pull request, overwritten on every run. Skipped for forks, whose token
      # cannot write comments, and for `infrastructure`, which touches no mathematics.
      - name: Prepare the audit comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        run: |
          {
            cat .lake/audit.md
            echo
            echo "Commit: ${{ github.event.pull_request.head.sha }} · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > .lake/audit-comment.md
      - name: Comment the audit on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: axiom-audit
          path: .lake/audit-comment.md

      # Skipped for forks, which cannot write the base repository's cache.
      - name: Pack project cache
        run: lake pack
      - name: Save project cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/save@v6
        with:
          path: .lake/AlphaCentauri-x86_64-unknown-linux-gnu.tar.gz
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Fail if the audit failed
        if: steps.audit.outcome != 'success'
        run: |
          echo "the axiom audit failed; see the 'Audit axioms' step"
          exit 1

      # The zoo scans `Foundation` too, which this job has already built.
      - uses: extractions/setup-just@v3
      - uses: typst-community/setup-typst@v4
      - uses: ts-graphviz/setup-graphviz@v2
      - name: Generate the zoo
        run: just zoo
      - name: Upload the zoo
        uses: actions/upload-artifact@v7
        with:
          name: zoo
          path: pages/zoo

  # The title becomes the commit subject on `main`, and only a pull request has one.
  pr-title:
    name: Check PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the pull request title
        env:
          # Passed through the environment, never interpolated into the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check-pr-title.py

  # An unproved statement is an `axiom` under its own name, never a `sorry`, so that the audit
  # reports the debt by name. This is the mechanical guard, and needs neither Lean nor a build.
  no-sorry:
    name: Check no sorry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - name: Forbid sorry
        run: just no-sorry

  # mk_all only scans the source tree (no build), so it runs as its own lightweight job.
  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  # A pull request builds the zoo but does not publish it.
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - no-sorry
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout: the artifact is the whole of what gets published.
      - name: Download the zoo
        uses: actions/download-artifact@v8
        with:
          name: zoo
          path: pages/zoo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
