<!doctype html>
<!--
  The list of open problems of AlphaCentauri. `just open-problems` copies this page and its style
  `index.css` next to `open-problems.json`, written by `lake exe open_problems`, and
  `references.json`, the entries of `references.yml` formatted by `references.py`; the page renders
  the two at load time.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open problems — AlphaCentauri</title>
<script>
  // Applied before the page is drawn, so that a chosen theme never flashes the other one.
  try {
    const theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch (_) {}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <a class="home" href="#top">Open problems</a>
      <select id="theme" aria-label="Theme">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <input id="filter" type="search" placeholder="Filter by name, statement, or key"
           aria-label="Filter the open problems">
    <nav aria-label="Contents"><ol id="toc"></ol></nav>
  </aside>
  <main id="top">
    <header>
      <h1>Open problems</h1>
      <p>
        The open problems stated in
        <a href="https://github.com/FormalizedFormalLogic/AlphaCentauri">AlphaCentauri</a>, each
        declared in Lean by <code>open_problem</code> as a proposition whose truth is unknown.
        <span id="summary"></span>
      </p>
      <p>
        To add a problem, <a href="https://github.com/FormalizedFormalLogic/AlphaCentauri/issues/new?template=open-problem.yml">open
        an issue</a> with its statement and a source.
      </p>
    </header>
    <div id="problems"><p>Loading…</p></div>
    <section id="references"></section>
  </main>
</div>
<script>
"use strict";

const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
})[c]);

// A docstring in Markdown with TeX: paragraphs, inline code and links. TeX is left to KaTeX, so
// that `_` and `\` inside `$…$` are never read as Markdown.
function renderMarkdown(text) {
  return text.split(/\n\s*\n/).map((para) => {
    const parts = para.split(/(`[^`]*`)/);
    const html = parts.map((part) => {
      if (part.startsWith("`") && part.endsWith("`") && part.length >= 2) {
        return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
      }
      return escapeHtml(part).replace(
        /\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, t, u) => `<a href="${u}">${t}</a>`);
    }).join("");
    return `<p>${html}</p>`;
  }).join("");
}

// The citations of a problem as one entry per key, with the locators of all of them.
function groupCitations(citations) {
  const groups = new Map();
  for (const c of citations) {
    if (!groups.has(c.key)) groups.set(c.key, []);
    if (c.locator) groups.get(c.key).push(c.locator);
  }
  return groups;
}

// A citation: its label, which links to the end of the list, and the reference formatted by
// `references.py` from the repository's own bibliography.
function renderCitation(key, locators, bib) {
  const label = escapeHtml(key) + (locators.length ? `, ${escapeHtml(locators.join("; "))}` : "");
  return `<li><a class="key" href="#ref-${escapeHtml(key)}">[${label}]</a> ${bib[key] ?? ""}</li>`;
}

// The references cited by some problem, in the order of the formatted text, each with links back
// to the problems citing it.
function renderBibliography(problems, bib, prefixes) {
  const text = (key) => (bib[key] || key).replace(/<[^>]*>/g, "");
  const citedBy = new Map();
  for (const p of problems) {
    for (const key of new Set(p.citations.map((c) => c.key))) {
      if (!citedBy.has(key)) citedBy.set(key, []);
      citedBy.get(key).push(p);
    }
  }
  const keys = [...citedBy.keys()].sort((a, b) => text(a).localeCompare(text(b)));
  const backlinks = (key) => citedBy.get(key).map((p) =>
    `<li><a href="#${escapeHtml(p.name)}">${escapeHtml(displayName(p, prefixes.get(areaOf(p.module))))}</a></li>`)
    .join("");
  return `<h2>References</h2><ol class="bibliography">${keys.map((k) =>
    `<li id="ref-${escapeHtml(k)}"><span class="key">[${escapeHtml(k)}]</span>
       <span class="entry">${bib[k] ?? ""}
         <div class="backlinks">Cited in<ul>${backlinks(k)}</ul></div></span></li>`).join("")}</ol>`;
}

// The area of a module: the component after `AlphaCentauri`, e.g. `NumberTheory`.
const areaOf = (module) => module.split(".")[1] || module;

// The namespace shared by all of `names`, as a list of components.
function commonNamespace(names) {
  const parts = names.map((n) => n.split(".").slice(0, -1));
  const common = [];
  for (let i = 0; parts.every((p) => i < p.length && p[i] === parts[0][i]); i++) common.push(parts[0][i]);
  return common;
}

// The name of `p` without the namespace `prefix` shared by the problems of its area.
const displayName = (p, prefix) => p.name.split(".").slice(prefix.length).join(".");

function renderProblem(p, bib, prefix) {
  const cites = [...groupCitations(p.citations)].map(([k, ls]) => renderCitation(k, ls, bib)).join("");
  return `<article id="${escapeHtml(p.name)}"
      data-search="${escapeHtml([p.name, p.description, ...p.citations.map((c) => c.key)]
        .join(" ").toLowerCase())}">
    <h3><a class="anchor" href="#${escapeHtml(p.name)}">${escapeHtml(displayName(p, prefix))}</a></h3>
    <div class="statement">${renderMarkdown(p.description)}</div>
    ${cites ? `<ul class="citations">${cites}</ul>` : ""}
    <pre class="lean"><code>${escapeHtml(p.source)}</code></pre>
    <div class="meta"><code>${escapeHtml(p.name)}</code> ·
      <a href="${escapeHtml(p.url)}">${escapeHtml(p.path)}:${p.line}</a></div>
  </article>`;
}

function renderToc(areas, prefixes) {
  return [...areas].map(([a, ps]) =>
    `<li class="area"><a href="#area-${escapeHtml(a)}">${escapeHtml(a)}</a>
       <span class="count">${ps.length}</span>
       <ol>${ps.map((p) => `<li data-target="${escapeHtml(p.name)}">
         <a href="#${escapeHtml(p.name)}">${escapeHtml(displayName(p, prefixes.get(a)))}</a></li>`)
         .join("")}</ol></li>`).join("") +
    `<li class="area"><a href="#references">References</a></li>`;
}

// The theme selector: `auto` follows the system, and the choice is remembered.
function setUpTheme() {
  const select = document.getElementById("theme");
  select.value = document.documentElement.dataset.theme || "auto";
  select.addEventListener("change", () => {
    const theme = select.value;
    if (theme === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    try {
      if (theme === "auto") localStorage.removeItem("theme");
      else localStorage.setItem("theme", theme);
    } catch (_) {}
  });
}

// Marks in the contents the problem being read: the last one whose top has passed the upper part
// of the window. It follows the scroll position, so a click on the contents marks its target at once.
function setUpScrollSpy(container, toc) {
  const sidebar = document.querySelector(".sidebar");
  const items = new Map([...toc.querySelectorAll("li[data-target]")]
    .map((li) => [li.dataset.target, li]));
  let current = null;
  // Brings `li` into view in the sidebar without scrolling anything else.
  const reveal = (li) => {
    const l = li.getBoundingClientRect(), s = sidebar.getBoundingClientRect();
    if (l.top < s.top + 8) sidebar.scrollTop += l.top - s.top - 8;
    else if (l.bottom > s.bottom - 8) sidebar.scrollTop += l.bottom - s.bottom + 8;
  };
  const update = () => {
    const shown = [...container.querySelectorAll("article")].filter((a) => !a.hidden);
    let spied = shown[0];
    for (const art of shown) {
      if (art.getBoundingClientRect().top > window.innerHeight * 0.3) break;
      spied = art;
    }
    if (!spied || spied === current) return;
    current = spied;
    for (const li of items.values()) li.classList.remove("current");
    const li = items.get(spied.id);
    if (li) {
      li.classList.add("current");
      reveal(li);
    }
  };
  window.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", update);
  update();
  return update;
}

// The filter hides the problems that do not match, in the list and in the contents alike.
function setUpFilter(container, toc, update) {
  document.getElementById("filter").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    for (const section of container.querySelectorAll("section")) {
      let shown = 0;
      for (const art of section.querySelectorAll("article")) {
        art.hidden = q !== "" && !art.dataset.search.includes(q);
        const li = toc.querySelector(`li[data-target="${CSS.escape(art.id)}"]`);
        if (li) li.hidden = art.hidden;
        if (!art.hidden) shown++;
      }
      section.hidden = shown === 0;
      const area = toc.querySelector(`a[href="#${CSS.escape(section.id)}"]`)?.closest("li.area");
      if (area) area.hidden = shown === 0;
    }
    update();
  });
}

// Unicode's mathematical alphanumerics, which the browser draws in Libertinus Math: for each style
// the code points of `A`, `a` and `0`. Chromium's MathML honours only `mathvariant="normal"`, so a
// letter in another style, as in $\mathsf{I}$, is written as the character of that style.
const ALPHANUMERICS = {
  "bold": [0x1D400, 0x1D41A, 0x1D7CE],
  "bold-italic": [0x1D468, 0x1D482, null],
  "sans-serif": [0x1D5A0, 0x1D5BA, 0x1D7E2],
  "monospace": [0x1D670, 0x1D68A, 0x1D7F6],
  "double-struck": [0x1D538, 0x1D552, 0x1D7D8],
  "script": [0x1D49C, 0x1D4B6, null],
  "fraktur": [0x1D504, 0x1D51E, null],
};
// The letters of the styles that Unicode keeps in the block of letterlike symbols.
const LETTERLIKE = {
  "double-struck": { C: "ℂ", H: "ℍ", N: "ℕ", P: "ℙ", Q: "ℚ", R: "ℝ", Z: "ℤ" },
  "script": { B: "ℬ", E: "ℰ", F: "ℱ", H: "ℋ", I: "ℐ", L: "ℒ", M: "ℳ", R: "ℛ", e: "ℯ", g: "ℊ", o: "ℴ" },
  "fraktur": { C: "ℭ", H: "ℌ", I: "ℑ", R: "ℜ", Z: "ℨ" },
};

function styledCharacter(variant, ch) {
  const [upper, lower, digit] = ALPHANUMERICS[variant];
  const code = ch.charCodeAt(0);
  if (LETTERLIKE[variant]?.[ch]) return LETTERLIKE[variant][ch];
  if (code >= 65 && code <= 90) return String.fromCodePoint(upper + code - 65);
  if (code >= 97 && code <= 122) return String.fromCodePoint(lower + code - 97);
  if (digit !== null && code >= 48 && code <= 57) return String.fromCodePoint(digit + code - 48);
  return ch;
}

function styleMathVariants(container) {
  for (const el of container.querySelectorAll("math [mathvariant]")) {
    const variant = el.getAttribute("mathvariant");
    if (!(variant in ALPHANUMERICS) || el.children.length > 0) continue;
    el.textContent = [...el.textContent].map((ch) => styledCharacter(variant, ch)).join("");
    el.setAttribute("mathvariant", "normal");
  }
}

// MathML takes the `−` of `(−1/q)` for a binary operator, as the `(` before it is a sibling, and
// spaces it so; after another operator it is a sign, as in TeX.
function markSigns(container) {
  for (const mo of container.querySelectorAll("math mo")) {
    if (!["+", "−", "±", "∓"].includes(mo.textContent)) continue;
    if (mo.previousElementSibling?.localName === "mo") mo.setAttribute("form", "prefix");
  }
}

// Goes to the problem named by the address, again once the fonts, which change the heights of the
// problems above it, are loaded, unless the reader has scrolled away in the meantime.
function goToHash() {
  const target = () => location.hash
    ? document.getElementById(decodeURIComponent(location.hash.slice(1))) : null;
  const go = () => target()?.scrollIntoView({ behavior: "instant" });
  go();
  const at = window.scrollY;
  document.fonts.ready.then(() => { if (Math.abs(window.scrollY - at) < 2) go(); });
}

async function main() {
  setUpTheme();
  const [data, bib] = await Promise.all([
    fetch("open-problems.json").then((r) => r.json()),
    fetch("references.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
  ]);
  const areas = new Map();
  for (const p of data.problems) {
    const a = areaOf(p.module);
    if (!areas.has(a)) areas.set(a, []);
    areas.get(a).push(p);
  }
  const prefixes = new Map([...areas].map(([a, ps]) => [a, commonNamespace(ps.map((p) => p.name))]));
  const rev = data.revision;
  document.getElementById("summary").innerHTML =
    `${data.problems.length} problems. Last updated ${escapeHtml(data.updated)}, from
     <a href="https://github.com/${escapeHtml(data.repository)}/tree/${escapeHtml(rev)}">
     <code>${escapeHtml(rev.slice(0, 7))}</code></a>.`;
  const toc = document.getElementById("toc");
  toc.innerHTML = renderToc(areas, prefixes);
  const container = document.getElementById("problems");
  container.innerHTML = [...areas].map(([a, ps]) =>
    `<section id="area-${escapeHtml(a)}"><h2>${escapeHtml(a)}</h2>
       ${ps.map((p) => renderProblem(p, bib, prefixes.get(a))).join("")}
     </section>`).join("");
  renderMathInElement(container, {
    delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
    output: "mathml",
    throwOnError: false,
  });
  styleMathVariants(container);
  markSigns(container);
  document.getElementById("references").innerHTML = renderBibliography(data.problems, bib, prefixes);
  const update = setUpScrollSpy(container, toc);
  setUpFilter(container, toc, update);
  goToHash();
}

window.addEventListener("DOMContentLoaded", () => main().catch((err) => {
  document.getElementById("problems").innerHTML =
    `<p>Could not load the open problems: ${escapeHtml(String(err))}</p>`;
}));
</script>
</body>
</html>
