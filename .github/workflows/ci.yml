name: CI

on:
  push:
    branches:
      - main
  # Every pull request, including one stacked on another pull request's branch.
  pull_request:
  merge_group:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      LAKE_ARTIFACT_CACHE: true
      LAKE_RESTORE_ARTIFACTS: true
      LAKE_NO_CACHE: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      - name: Restore remote cache (Foundation)
        env:
          LAKE_CONFIG: lake-cache.toml
        run: |
          lake cache get \
            --service ffl \
            --max-revs=100 \
            --repo FormalizedFormalLogic/Foundation \
            --package Foundation \
          || echo "::warning::Foundation's cache is incomplete; the build will compile the rest from source"

      - name: Restore remote cache (AlphaCentauri)
        env:
          LAKE_CONFIG: lake-cache.toml
        run: |
          lake cache get \
            --service ffl \
            --max-revs=100 \
            --repo FormalizedFormalLogic/AlphaCentauri \
          || echo "::warning::AlphaCentauri's cache is incomplete; the build will compile the rest from source"

      - run: lake build Foundation
      - run: lake build AlphaCentauri --wfail

      - name: Audit axioms
        id: audit
        continue-on-error: true
        run: just axiom-audit
      - name: Prepare the audit comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        run: |
          {
            python3 .github/scripts/audit-comment.py .lake/audit.json
            echo
            echo "Commit: ${{ github.event.pull_request.head.sha }} · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > .lake/audit-comment.md
      - name: Comment the audit on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: axiom-audit
          path: .lake/audit-comment.md
      - name: Fail if the audit failed
        if: steps.audit.outcome != 'success'
        run: |
          echo "the axiom audit failed; see the 'Audit axioms' step"
          exit 1

      - name: Save remote cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LAKE_CONFIG: lake-cache.toml
          LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
        run: |
          lake build --no-build -o .lake/outputs.jsonl AlphaCentauri
          lake cache put \
            .lake/outputs.jsonl \
            --service ffl-upload \
            --repo FormalizedFormalLogic/AlphaCentauri

      - uses: typst-community/setup-typst@v4
      - uses: ts-graphviz/setup-graphviz@v2
      - run: just zoo
      - name: Upload the zoo
        uses: actions/upload-artifact@v7
        with:
          name: zoo
          path: pages/zoo

  no-sorry:
    name: Check no sorry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - name: Forbid sorry
        run: just no-sorry

  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - no-sorry
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the zoo
        uses: actions/download-artifact@v8
        with:
          name: zoo
          path: pages/zoo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
