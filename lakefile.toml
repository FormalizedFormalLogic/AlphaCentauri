name = "AlphaCentauri"
version = "0.1.0"
defaultTargets = ["AlphaCentauri"]

[leanOptions]
pp.unicode.fun = true
weak.linter.flexible = true
weak.linter.refine = true
weak.linter.oldObtain = true
weak.linter.style.multiGoal = true

[[lean_lib]]
name = "AlphaCentauri"

[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation"
rev = "master"

# `lake exe audit`: the axiom audit of `AlphaCentauri` against `forgive.yml` (Audit/Main.lean).
# Run after `lake build`; the script imports only `Lean`, so building it costs nothing.
[[lean_exe]]
name = "audit"
root = "Audit.Main"
supportInterpreter = true

# Generator of the theory zoo. Kept out of `defaultTargets`: it is built by `just zoo`.
[[lean_lib]]
name = "Zoo"
globs = ["Zoo.+"]

[[lean_exe]]
name = "zoo_arithmetic"
root = "Zoo.Arithmetic"
supportInterpreter = true
