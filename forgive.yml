# The outstanding debt of the library, declaration by declaration.
#
# AlphaCentauri does not use `sorry`: a statement that is formalized but not yet proved is
# declared as an `axiom`, so the audit reports it under its own name and every declaration that
# leans on it says which unproved result it leans on. This file is that ledger, read by
# `lake exe forgive AlphaCentauri` (`just axiom-audit`); the format is documented in
# https://github.com/FormalizedFormalLogic/forgive.
#
#   declaration:
#     AlphaCentauri.someLemma:
#       forgive:
#         - AlphaCentauri.someLemma    # the axiom standing in for its own proof
#     AlphaCentauri.usesSomeLemma:
#       forgive:
#         - AlphaCentauri.someLemma    # only the debt reached through `someLemma`
#
# Every entry and every forgiven name must be needed, so the file stays exact: proving a
# statement means deleting its `axiom` and every entry that named it. `sorryAx` must never
# appear here; CI checks that it does not.

version: v0

# The axioms every declaration may use.
accept:
  - propext
  - Classical.choice
  - Quot.sound

declaration:
  # The unproved statements themselves.
  FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.rewrite:
    forgive:
      - FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.rewrite
  FFL.FirstOrder.Arithmetic.ISigma.provable_con_ISigma1:
    forgive:
      - FFL.FirstOrder.Arithmetic.ISigma.provable_con_ISigma1
  FFL.FirstOrder.Arithmetic.Peano.essentiallyReflexive:
    forgive:
      - FFL.FirstOrder.Arithmetic.Peano.essentiallyReflexive
  FFL.FirstOrder.Arithmetic.Peano.reflexive:
    forgive:
      - FFL.FirstOrder.Arithmetic.Peano.reflexive
  FFL.FirstOrder.Arithmetic.parsons:
    forgive:
      - FFL.FirstOrder.Arithmetic.parsons
  FFL.FirstOrder.Arithmetic.parsons_primrec:
    forgive:
      - FFL.FirstOrder.Arithmetic.parsons_primrec
  FFL.FirstOrder.Arithmetic.primrec'_of_provablyTotal:
    forgive:
      - FFL.FirstOrder.Arithmetic.primrec'_of_provablyTotal
  FFL.FirstOrder.Arithmetic.provable_infinitudeOfPrimes_ElementaryArithmetic:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_infinitudeOfPrimes_ElementaryArithmetic
  FFL.FirstOrder.Arithmetic.provable_infinitudeOfPrimes_ISigma0:
    forgive:
      # An open problem, not a theorem awaiting formalization: [PWW88, Problem 1].
      - FFL.FirstOrder.Arithmetic.provable_infinitudeOfPrimes_ISigma0
  FFL.FirstOrder.Arithmetic.provable_infinitudeOfPrimes_ISigma0_union_Omega1:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_infinitudeOfPrimes_ISigma0_union_Omega1
  FFL.FirstOrder.Arithmetic.provable_iterCon_iff_not_iterate_standardProvability_bot:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_iterCon_iff_not_iterate_standardProvability_bot
  FFL.FirstOrder.Arithmetic.uniformReflectionOn_Sigma_equiv_Pi_succ:
    forgive:
      - FFL.FirstOrder.Arithmetic.uniformReflectionOn_Sigma_equiv_Pi_succ

  # Declarations that inherit the debt of an unproved statement.
  FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.all_of_free:
    forgive:
      - FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.rewrite
  FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.all_of_fresh:
    forgive:
      - FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.rewrite
  FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.neg_exs_of_free:
    forgive:
      - FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.rewrite
  FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.neg_exs_of_fresh:
    forgive:
      - FFL.FirstOrder.Arithmetic.Bootstrapping.Derivable.rewrite
  FFL.FirstOrder.Arithmetic.Peano.not_finiteAxiomatizable:
    forgive:
      - FFL.FirstOrder.Arithmetic.Peano.reflexive
  FFL.FirstOrder.Arithmetic.exists_prime_gt:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_infinitudeOfPrimes_ISigma0_union_Omega1
  FFL.FirstOrder.Arithmetic.not_finiteAxiomatizable_of_Peano_le:
    forgive:
      - FFL.FirstOrder.Arithmetic.Peano.essentiallyReflexive
  FFL.FirstOrder.Arithmetic.not_provablyTotal_ackermann:
    forgive:
      - FFL.FirstOrder.Arithmetic.parsons
  FFL.FirstOrder.Arithmetic.provablyTotalFunctions_ISigma1:
    forgive:
      - FFL.FirstOrder.Arithmetic.parsons
