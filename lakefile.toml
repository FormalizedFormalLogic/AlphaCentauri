name = "AlphaCentauri"
version = "0.1.0"
defaultTargets = ["AlphaCentauri"]

# One published Lake cache then serves every platform, not just CI's Linux. Revisit if a native
# library is added; Lake already drops platform-dependent executable outputs by itself.
platformIndependent = true

# Mathlib's own options: `autoImplicit` off, and the standard linter set that downstream
# projects are meant to opt into wholesale (see `register_linter_set linter.mathlibStandardSet`
# in `Mathlib/Init.lean`), which subsumes the individual linters this file used to list. Only
# the header linter is dropped: it enforces Mathlib's copyright header, which this repository
# does not carry. `lake build --wfail`, which CI and the pre-push hook use, turns every warning
# the set emits into an error.
[leanOptions]
pp.unicode.fun = true
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[lean_lib]]
name = "AlphaCentauri"

# Foundation follows `master`, and `lake-manifest.json` records the exact revision that resolves
# to; the manifest is committed, so what CI builds is what a checkout builds. `lake update` is run
# only by `.github/workflows/update-deps.yml` (see docs/workflow.md).
[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation"
rev = "master"

# Provability logic: GL's Kripke semantics and its arithmetical soundness for any provability
# predicate satisfying the Hilbert–Bernays–Löb conditions. It is followed like Foundation, whose
# pin in this manifest is the one it is built against.
[[require]]
name = "ProvabilityLogic"
git = "https://github.com/FormalizedFormalLogic/ProvabilityLogic"
rev = "main"

# `lake exe forgive AlphaCentauri` (`just axiom-audit`): the axiom audit against `forgive.yml`.
# Run after `lake build`; it reads the oleans. The package imports only `Lean` and `Cli`, whose
# internals move between toolchains, so it is pinned to the tag naming ours — a bare revision only
# while Forgive has not tagged it — and `update-deps.yml` moves that pin with `lean-toolchain`.
[[require]]
name = "Forgive"
git = "https://github.com/FormalizedFormalLogic/forgive"
rev = "v4.34.0"

# Generator of the theory zoo. Kept out of `defaultTargets`: it is built by `just zoo`.
[[lean_lib]]
name = "AlphaCentauriZoo"
globs = ["AlphaCentauriZoo.+"]

[[lean_exe]]
name = "zoo_arithmetic"
root = "AlphaCentauriZoo.Arithmetic"
supportInterpreter = true
