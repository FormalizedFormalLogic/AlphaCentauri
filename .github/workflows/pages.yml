name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deployment at a time; a superseded run is left to finish rather than cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  zoo:
    name: Generate the theory zoo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - uses: extractions/setup-just@v3
      - uses: typst-community/setup-typst@v4
      - uses: ts-graphviz/setup-graphviz@v2

      # The zoo scans `Foundation` as well as `AlphaCentauri`, so the whole dependency is needed;
      # `just zoo` builds it. The key matches the one `ci.yml` writes.
      - name: Restore Foundation build
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages/Foundation/.lake/build
          key: foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Generate the zoo
        run: just zoo

      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    name: Deploy to GitHub Pages
    needs: zoo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
