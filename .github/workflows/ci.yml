name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Required so these checks also run against the queue's speculative merge
  # commit; otherwise a merge queue entry has no status checks to wait on.
  merge_group:
    branches:
      - main
  workflow_dispatch:

# Supersede stale runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── Job 1: hydrate + cleanse the dependency layer ──────────────────────────────────────────────
  # Absorb ALL the dependency-build noise HERE, off in its own job, so the build job below is clean.
  #   • mathlib comes from `lake exe cache get` (downloaded oleans carry no per-module log → silent).
  #   • Foundation is a git dependency with NO public olean cache, so it compiles from source and
  #     emits lint/deprecation warnings that are upstream's, not ours. We build it once here, then
  #     CLEAR its cached build logs so they don't `Replayed`-spam the build job with warnings we
  #     can't fix and don't want to read.
  # The built+cleansed Foundation is handed to the build job via a manifest-keyed cache. We
  # deliberately do NOT cache mathlib's oleans, since `cache get` re-hydrates those fast.
  # Bonus: keyed on toolchain+manifest, so Foundation only recompiles when its pinned rev bumps.
  deps:
    name: Build Foundation (cached)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Probe the Foundation cache FIRST. On a hit this job's product already exists, so every step
      # below is skipped and the post-job save re-affirms the existing entry — no wasted mathlib
      # `cache get` or Foundation build. Only on a MISS do we run lean-action and build from source.
      - name: Cache Foundation build (keyed on toolchain + manifest)
        id: foundation-cache
        uses: actions/cache@v6
        with:
          path: .lake/packages/Foundation/.lake/build
          key: foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      # elan + `lake exe cache get` only (build: false); we drive `lake build Foundation` ourselves.
      # Skip lean-action's own whole-.lake GitHub cache (use-github-cache: false) — we manage a
      # tighter, Foundation-only cache above instead of shuttling the full tree.
      - uses: leanprover/lean-action@v1
        if: steps.foundation-cache.outputs.cache-hit != 'true'
        with:
          build: false
          use-github-cache: false
      # Mathlib's cache leaves the runner's disk 97% full, and the cold Foundation build then fills
      # it and the runner is killed (exit 143) partway through `Foundation.FirstOrder.Arithmetic`.
      # Dropping the preinstalled toolchains we never use buys the tens of gigabytes it needs.
      - name: Free disk space
        if: steps.foundation-cache.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: Build Foundation from source (cache miss only)
        if: steps.foundation-cache.outputs.cache-hit != 'true'
        run: lake build Foundation
      # ── Clear Foundation's cached warnings ───────────────────────────────────────────────────────
      # Modern Lake stores each module's build diagnostics in its `.trace` file's `"log"` array and
      # RE-EMITS them (`⚠ Replayed`) on every downstream build. Emptying `"log"` drops the replay
      # WITHOUT touching the `.olean` (verified: no recompile, diagnostics vanish, build still green).
      # Runs on a cache miss only: a hit's saved cache is already cleared.
      - name: Clear Foundation's replayed-warning cache
        if: steps.foundation-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('.lake/packages/Foundation/.lake/build')
          cleared = 0
          for t in root.rglob('*.trace'):
              try:
                  d = json.loads(t.read_text())
              except (ValueError, OSError):
                  continue
              if d.get('log'):
                  d['log'] = []
                  t.write_text(json.dumps(d))
                  cleared += 1
          print(f'cleared warning cache in {cleared} Foundation trace(s)')
          PY

  # Build AlphaCentauri against the cleansed dependency layer from `deps`.
  build:
    name: Build project
    needs: deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the audit comment below
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      # Restore the Foundation build cleansed by `deps` (guaranteed present via `needs: deps`).
      - name: Restore Foundation build (warnings cleared)
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages/Foundation/.lake/build
          key: foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          fail-on-cache-miss: true

      # ── The project's own build cache (`lake pack`/`unpack`) ─────────────────────────────────────
      # Orthogonal to the Foundation cache above: `lake pack` archives ONLY the root package's
      # `.lake/build` (our own oleans), never the dependency trees. Restoring + unpacking it lets
      # `lake build` reuse traces and rebuild only the modules that actually changed. The key pins
      # toolchain+manifest (so a Foundation bump busts it) and appends sha because cache entries are
      # immutable; restore-keys fall back to the newest cache with a matching toolchain+manifest.
      - name: Restore project cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .lake/AlphaCentauri-x86_64-unknown-linux-gnu.tar.gz
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Unpack project cache
        if: hashFiles('.lake/AlphaCentauri-x86_64-unknown-linux-gnu.tar.gz') != ''
        run: lake unpack

      # `restore-keys` can fall back to a cache packed before a file was renamed or deleted; `lake
      # build` only rebuilds modules whose *source* changed, so a stale `.olean`/`.trace` for a
      # since-removed path survives untouched. Drop any build artifact whose module no longer has a
      # matching `.lean` file before building.
      - name: Prune orphaned build artifacts from renamed/removed sources
        run: |
          python3 - <<'PY'
          import pathlib
          src_root = pathlib.Path('AlphaCentauri')
          for build_root in [pathlib.Path('.lake/build/lib/lean/AlphaCentauri'), pathlib.Path('.lake/build/ir/AlphaCentauri')]:
              if not build_root.exists():
                  continue
              for f in sorted(build_root.rglob('*')):
                  if not f.is_file():
                      continue
                  rel_dir = f.relative_to(build_root).parent
                  base = f.name.split('.', 1)[0]
                  if not (src_root / rel_dir / f'{base}.lean').exists():
                      print(f'removing orphaned artifact {f}')
                      f.unlink()
          PY

      - name: Build AlphaCentauri
        run: lake build AlphaCentauri

      # `just axiom-audit`: no `sorry`, no `native_decide`, no axiom outside the allowlist, except
      # what `forgive.yml` forgives declaration by declaration — an unproved statement forgives
      # its own axiom name, so `sorryAx` is forgiven nowhere and a `sorry` fails here outright,
      # ahead of the `no-sorry` job. Reads the oleans just built and
      # writes `.lake/audit.json` and `.lake/audit.md`. A failure is deferred to the last step so
      # the report still reaches the pull request and the cache below is still saved.
      - name: Audit axioms
        id: audit
        continue-on-error: true
        run: lake exe audit
      # One comment per pull request, identified by `header` and overwritten on every run rather
      # than posted anew. Skipped for PRs from forks (their token cannot write comments) and for
      # PRs labelled `infrastructure`, which touch no mathematics and need no audit comment.
      - name: Prepare the audit comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        run: |
          {
            cat .lake/audit.md
            echo
            echo "Commit: ${{ github.event.pull_request.head.sha }} · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > .lake/audit-comment.md
      - name: Comment the audit on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: axiom-audit
          path: .lake/audit-comment.md

      # Re-pack the freshly built oleans and save under the exact primary key. Skipped for PRs from
      # forks (no write access to the base repo's cache); pushes and same-repo PRs refresh the entry.
      - name: Pack project cache
        run: lake pack
      - name: Save project cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/save@v6
        with:
          path: .lake/AlphaCentauri-x86_64-unknown-linux-gnu.tar.gz
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Fail if the audit failed
        if: steps.audit.outcome != 'success'
        run: |
          echo "the axiom audit failed; see the 'Audit axioms' step"
          exit 1

  # `sorry` is banned outright: an unproved statement is an `axiom` under its own name, so the
  # audit reports the debt by name instead of collapsing it into one anonymous `sorryAx`. This
  # job is the mechanical guard — no `sorry` in the sources, and no `sorryAx` forgiven in
  # `forgive.yml` (checked with yq, which reads the values rather than the file's text, so a
  # comment naming `sorryAx` is not a false positive). It needs neither Lean nor a build.
  # The PR title becomes the commit subject on `main` (squash merge), so it is checked here.
  # Runs only for pull requests; `merge_group` and `push` have no title to check.
  pr-title:
    name: Check PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the pull request title
        env:
          # Passed through the environment, never interpolated into the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check-pr-title.py

  no-sorry:
    name: Check no sorry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - name: Forbid sorry
        run: just no-sorry

  # mk_all only scans the source tree (no build), so it runs as its own lightweight job.
  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi
