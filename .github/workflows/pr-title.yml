name: PR title

# Its own workflow because of `edited`: that event in `ci.yml` would rebuild the library every
# time a body is reworded.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pr-title:
    name: Check PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check-pr-title.py
