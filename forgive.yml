      - FFL.FirstOrder.Arithmetic.ISigma0_union_Omega1_weakerThanOn_Pi1_ISigma0
  FFL.FirstOrder.Arithmetic.ISigma0.finiteAxiomatizable:
    forgive:
      # An open problem, not a theorem awaiting formalization: [HP98, Corollary V.4.39], [Kay91, Exercise 10.4].
      - FFL.FirstOrder.Arithmetic.ISigma0.finiteAxiomatizable
  FFL.FirstOrder.Arithmetic.ISigma0_union_Omega1.finiteAxiomatizable:
    forgive:
      # An open problem, not a theorem awaiting formalization: [HP98, Corollary V.4.39], [Kay91, Exercise 10.4].
      - FFL.FirstOrder.Arithmetic.ISigma0_union_Omega1.finiteAxiomatizable
  FFL.FirstOrder.Arithmetic.BSigma1_weakerThan_ISigma0_add_not_exp:
