name: Update dependencies

# Moves the followed pins onto one long-lived branch behind one pull request, and nothing else;
# `repair-deps.yml` fixes what the move breaks. See docs/workflow.md.
#
# It pushes as the organization's GitHub App because a `github.token` push starts no checks.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Shared with `repair-deps.yml`: a bump landing under an agent costs it the push it cannot force.
concurrency:
  group: update-deps-branch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: update-deps
  LABEL: update-deps
  TITLE: 'chore: Update dependencies'
  # `lakefile.toml` names; the repositories behind them are read from `lakefile.toml` too.
  FOLLOWED: Foundation
  TOOLCHAIN_PINNED: Forgive

jobs:
  update:
    name: Bump the pins
    if: github.repository == 'FormalizedFormalLogic/AlphaCentauri'
    runs-on: ubuntu-latest
    steps:
      - name: Mint the app token
        id: app-token
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Find the open pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          number=$(gh pr list --state open --head "$BRANCH" --limit 1 --json number --jq '.[0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "found the pull request: ${number:-none}"

      # Built on top of, never rewritten: the previous bump's repairs live on that branch.
      - name: Prepare the branch
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git switch --force-create "$BRANCH" "origin/$BRANCH"
          else
            git switch --force-create "$BRANCH" origin/main
          fi

      # Before lake runs, so it resolves under the toolchain it is resolving for.
      - name: Take the upstream toolchain
        run: |
          set -euo pipefail
          first=$(python3 .github/scripts/deps.py slug lakefile.toml "${FOLLOWED%% *}")
          curl -fsSL "https://raw.githubusercontent.com/$first/master/lean-toolchain" -o lean-toolchain
          echo "the toolchain is $(cat lean-toolchain), taken from $first"

      # Lake builds every dependency under the root toolchain, so a pin tied to it has to move.
      - name: Move the pins tied to the toolchain
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          for package in $TOOLCHAIN_PINNED; do
            python3 .github/scripts/deps.py pin-tag lakefile.toml "$package" "$(cat lean-toolchain)"
          done

      # elan only: the mathlib cache refuses this tree, whose toolchain and manifest disagree.
      - name: Install elan
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Update the manifest
        id: rev
        run: |
          set -euo pipefail
          pin() { jq -r --arg p "$2" '.packages[] | select(.name == $p) | .rev' "$1"; }
          before="$RUNNER_TEMP/manifest-before.json"
          cp lake-manifest.json "$before"
          # shellcheck disable=SC2086 # lists of package names, deliberately split
          lake update $FOLLOWED $TOOLCHAIN_PINNED
          rows=''
          for package in $FOLLOWED $TOOLCHAIN_PINNED; do
            old=$(pin "$before" "$package")
            new=$(pin lake-manifest.json "$package")
            [ "$old" != "$new" ] || continue
            repository=$(python3 .github/scripts/deps.py slug lakefile.toml "$package")
            rows="${rows:+$rows$'\n'}| \`$package\` | \`${old:0:7}\` | [\`${new:0:7}\`](https://github.com/$repository/compare/$old...$new) |"
            echo "$package: $old -> $new"
          done
          {
            echo 'body<<BODY'
            printf '%s\n' '| package | from | to |' '| --- | --- | --- |' "$rows"
            echo BODY
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          author=${APP_SLUG:+${APP_SLUG}[bot]}
          author=${author:-github-actions[bot]}
          git config user.name "$author"
          git config user.email "$(gh api "/users/${author//\[bot\]/%5Bbot%5D}" --jq .id)+$author@users.noreply.github.com"
          if git diff --quiet -- lakefile.toml lake-manifest.json lean-toolchain; then
            echo "the pins did not move; nothing to push"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "$TITLE" -- lakefile.toml lake-manifest.json lean-toolchain
          if [ -n "$PR_NUMBER" ]; then
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            git push --force-with-lease origin "HEAD:$BRANCH"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Rewritten every run, so notes about the bump belong in a comment.
      - name: Open or refresh the pull request
        id: open
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BODY: ${{ steps.rev.outputs.body }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          else
            url=$(gh pr create --base main --head "$BRANCH" --label "$LABEL" --title "$TITLE" --body "$BODY")
            PR_NUMBER=${url##*/}
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Queue the merge of a pins-only bump
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          NUMBER: ${{ steps.open.outputs.number }}
        run: |
          set -euo pipefail
          extra=$(git diff --name-only origin/main...HEAD |
            grep -vxE 'lake-manifest\.json|lakefile\.toml|lean-toolchain' || true)
          if [ -n "$extra" ]; then
            echo "the branch also changes:"
            echo "$extra"
            echo "the merge of #$NUMBER stays a human's"
            exit 0
          fi
          gh pr merge "$NUMBER" --squash --auto
          echo "queued the merge of #$NUMBER; GitHub performs it once the checks are green"
