name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the audit comment below
    steps:
      - uses: actions/checkout@v7
        with:
          # `lake cache get` walks back from HEAD to a published revision.
          fetch-depth: 100
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      # Entries are immutable, hence the sha; `restore-keys` finds the newest one on these pins.
      - name: Restore project cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .lake/AlphaCentauri-x86_64-unknown-linux-gnu.tar.gz
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Unpack project cache
        if: hashFiles('.lake/AlphaCentauri-x86_64-unknown-linux-gnu.tar.gz') != ''
        run: lake unpack

      # This library's own outputs from the shared FFL R2 cache, keyed by revision rather than by
      # branch, so it also covers fork pull requests and fresh clones.
      - name: Restore the Lake cache
        uses: FormalizedFormalLogic/.github/lake-cache/restore@main
        with:
          # A tarball hit above already carries everything this would fetch.
          skip-download: ${{ steps.cache-restore.outputs.cache-matched-key != '' }}
          # No freshness assertion: Mathlib is a separate cache, and `lake exe cache get` is
          # occasionally short a module nothing here uses. The build below compiles what is
          # missing, as it always has.
          assert-fresh: ''

      # Foundation's oleans, published by its own CI and read at the revision the manifest pins,
      # so that a bump of that pin costs a download rather than an hour of elaboration.
      - name: Restore Foundation's build from the Lake cache
        uses: FormalizedFormalLogic/.github/lake-cache/restore@main
        with:
          repo: FormalizedFormalLogic/Foundation
          package: Foundation
          assert-fresh: ''
      # Nothing to do when the step above filled the build; a source build otherwise.
      - name: Build Foundation
        run: lake build Foundation
      # Lake replays a dependency's cached warnings on every downstream build, and `--wfail` below
      # would take them for ours.
      - name: Clear Foundation's replayed-warning cache
        run: python3 .github/scripts/clear-dep-warnings.py .lake/packages/Foundation/.lake/build

      # A fallback cache carries artifacts of sources since renamed or deleted; lake keeps them.
      - name: Prune orphaned build artifacts from renamed/removed sources
        run: |
          python3 - <<'PY'
          import pathlib
          src_root = pathlib.Path('AlphaCentauri')
          for build_root in [pathlib.Path('.lake/build/lib/lean/AlphaCentauri'), pathlib.Path('.lake/build/ir/AlphaCentauri')]:
              if not build_root.exists():
                  continue
              for f in sorted(build_root.rglob('*')):
                  if not f.is_file():
                      continue
                  rel_dir = f.relative_to(build_root).parent
                  base = f.name.split('.', 1)[0]
                  if not (src_root / rel_dir / f'{base}.lean').exists():
                      print(f'removing orphaned artifact {f}')
                      f.unlink()
          PY

      - name: Build AlphaCentauri (warnings are errors)
        run: lake build AlphaCentauri --wfail

      # Deferred to the last step, so the report still reaches the pull request.
      - name: Audit axioms
        id: audit
        continue-on-error: true
        run: just axiom-audit
      - name: Prepare the audit comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        run: |
          {
            python3 .github/scripts/audit-comment.py .lake/audit.json
            echo
            echo "Commit: ${{ github.event.pull_request.head.sha }} · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > .lake/audit-comment.md
      - name: Comment the audit on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: axiom-audit
          path: .lake/audit-comment.md

      # Not in the merge queue, whose cache scope dies with the entry and is readable by nothing.
      - name: Pack project cache
        if: github.event_name != 'merge_group'
        run: lake pack
      - name: Save project cache
        if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v6
        with:
          path: .lake/AlphaCentauri-x86_64-unknown-linux-gnu.tar.gz
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Fail if the audit failed
        if: steps.audit.outcome != 'success'
        run: |
          echo "the axiom audit failed; see the 'Audit axioms' step"
          exit 1

      # `main` only, after every gate above: a pull request builds a tree that will not exist
      # after the squash-merge, and a fork pull request gets no secrets anyway.
      - name: Publish the Lake cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: FormalizedFormalLogic/.github/lake-cache/publish@main
        with:
          cache-key: ${{ secrets.LAKE_CACHE_KEY }}
          targets: AlphaCentauri

      - uses: typst-community/setup-typst@v4
      - uses: ts-graphviz/setup-graphviz@v2
      - name: Generate the zoo
        run: just zoo
      - name: Upload the zoo
        uses: actions/upload-artifact@v7
        with:
          name: zoo
          path: pages/zoo

  no-sorry:
    name: Check no sorry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - name: Forbid sorry
        run: just no-sorry

  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - no-sorry
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the zoo
        uses: actions/download-artifact@v8
        with:
          name: zoo
          path: pages/zoo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
