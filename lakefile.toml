name = "AlphaCentauri"
version = "0.1.0"
defaultTargets = ["AlphaCentauri"]

[leanOptions]
pp.unicode.fun = true
weak.linter.flexible = true
weak.linter.refine = true
weak.linter.oldObtain = true
weak.linter.style.multiGoal = true

[[lean_lib]]
name = "AlphaCentauri"

# Pinned to an exact revision, never a branch: what CI builds is what a checkout builds. The pin
# is moved forward by `.github/workflows/update-foundation.yml` (see docs/workflow.md).
[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation"
rev = "81810b9f22c49fbb32bd89c1e9737059d83a37e6"

# `lake exe forgive AlphaCentauri` (`just axiom-audit`): the axiom audit against `forgive.yml`.
# Run after `lake build`; it reads the oleans. The package imports only `Lean` and `Cli`.
[[require]]
name = "Forgive"
git = "https://github.com/FormalizedFormalLogic/forgive"
rev = "32667a1902df73e5f27cdfcef57855e6b8b24d55"

# Generator of the theory zoo. Kept out of `defaultTargets`: it is built by `just zoo`.
[[lean_lib]]
name = "AlphaCentauriZoo"
globs = ["AlphaCentauriZoo.+"]

[[lean_exe]]
name = "zoo_arithmetic"
root = "AlphaCentauriZoo.Arithmetic"
supportInterpreter = true
