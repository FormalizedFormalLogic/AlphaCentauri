name: Build

on:
  push:
    branches:
      - main
  pull_request:

# A new push to a pull request cancels the run still in flight for it; runs on `main` are
# never cancelled, so every commit that lands keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"

      # `just mk-all`: AlphaCentauri.lean must import every module under AlphaCentauri/.
      # Run after lean-action rather than through its `mk_all-check` input, because that step
      # runs before the Mathlib cache is fetched and would build `mk_all` from source.
      - name: Check AlphaCentauri.lean imports every module
        run: lake exe mk_all --check --lib AlphaCentauri --module
