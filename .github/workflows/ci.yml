name: CI

on:
  push:
    branches:
      - main
  # Every pull request, including one stacked on another pull request's branch.
  pull_request:
  merge_group:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  LAKE_ARTIFACT_CACHE: true
  LAKE_RESTORE_ARTIFACTS: true
  LAKE_NO_CACHE: true

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: ./.github/actions/setup-lean
      - name: Print tool versions
        run: |
          lake --version
          lean --version

      - run: lake build Foundation
      - run: lake build AlphaCentauri --wfail

      - name: Audit axioms
        id: audit
        continue-on-error: true
        run: just axiom-audit
      - name: Prepare the audit comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        run: |
          {
            python3 .github/scripts/audit-comment.py .lake/audit.json
            echo
            echo "Commit: ${{ github.event.pull_request.head.sha }} · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > .lake/audit-comment.md
      - name: Comment the audit on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'infrastructure')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: axiom-audit
          path: .lake/audit-comment.md
      - name: Fail if the audit failed
        if: steps.audit.outcome != 'success'
        run: |
          echo "the axiom audit failed; see the 'Audit axioms' step"
          exit 1

      # A merge-queue commit becomes `main` as is, so publishing it there lets the push run that
      # follows, and the jobs below, restore it instead of compiling it again.
      - name: Save remote cache
        if: >-
          github.event_name == 'merge_group' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          LAKE_CONFIG: lake-cache.toml
          LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
        run: |
          lake build --no-build -o .lake/outputs.jsonl AlphaCentauri
          lake cache put \
            .lake/outputs.jsonl \
            --service ffl-upload \
            --repo FormalizedFormalLogic/AlphaCentauri

  # The jobs below only produce what `deploy` publishes from `main`; `workflow_dispatch` lets a
  # branch try them out.
  import-graph:
    name: Generate import graph
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: ./.github/actions/setup-lean
      - uses: ts-graphviz/setup-graphviz@v2

      - run: lake build AlphaCentauri
      - run: just import-graph

      - uses: actions/upload-artifact@v7
        with:
          name: import-graph
          path: |
            import_graph.png
            import_graph.pdf
            import_graph.html
          retention-days: 1

  zoo:
    name: Generate zoo
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: ./.github/actions/setup-lean
      - uses: typst-community/setup-typst@v5

      - run: lake build AlphaCentauri
      - run: just zoo

      - uses: actions/upload-artifact@v7
        with:
          name: zoo
          path: pages/zoo
          retention-days: 1

  no-sorry:
    name: Check no sorry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Forbid sorry
        run: just no-sorry

  # `mk_all` needs none of Mathlib's oleans, so this job skips the caches `setup-lean` fetches.
  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Setup elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - import-graph
      - zoo
      - no-sorry
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the import graph
        uses: actions/download-artifact@v8
        with:
          name: import-graph
          path: pages
      - name: Download the zoo
        uses: actions/download-artifact@v8
        with:
          name: zoo
          path: pages/zoo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
