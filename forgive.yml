# The outstanding debt of the library, declaration by declaration.
#
# AlphaCentauri does not use `sorry`: a statement that is formalized but not yet proved is
# declared as an `axiom`, so the audit reports it under its own name and every declaration that
# leans on it says which unproved result it leans on. This file is that ledger, read by
# `lake exe forgive AlphaCentauri` (`just axiom-audit`); the format is documented in
# https://github.com/FormalizedFormalLogic/forgive.
#
#   declaration:
#     AlphaCentauri.someLemma:
#       forgive:
#         - AlphaCentauri.someLemma    # the axiom standing in for its own proof
#     AlphaCentauri.usesSomeLemma:
#       forgive:
#         - AlphaCentauri.someLemma    # only the debt reached through `someLemma`
#
# Every entry and every forgiven name must be needed, so the file stays exact: proving a
# statement means deleting its `axiom` and every entry that named it. `sorryAx` must never
# appear here; CI checks that it does not.

version: v0

# The axioms every declaration may use.
accept:
  - propext
  - Classical.choice
  - Quot.sound

declaration:
  # The unproved statements themselves.
  FFL.FirstOrder.Arithmetic.provable_iterCon_iff_not_iterate_standardProvability_bot:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_iterCon_iff_not_iterate_standardProvability_bot
  FFL.FirstOrder.Arithmetic.provablyTotalFunctions_IParameterFree_Pi:
    forgive:
      - FFL.FirstOrder.Arithmetic.provablyTotalFunctions_IParameterFree_Pi
  FFL.FirstOrder.Arithmetic.provablyTotalFunctions_ISigma_union_IParameterFree_Pi:
    forgive:
      - FFL.FirstOrder.Arithmetic.provablyTotalFunctions_ISigma_union_IParameterFree_Pi
  FFL.FirstOrder.Arithmetic.uniformReflectionOn_Sigma_equiv_Pi_succ:
    forgive:
      - FFL.FirstOrder.Arithmetic.uniformReflectionOn_Sigma_equiv_Pi_succ
  FFL.FirstOrder.Arithmetic.uniformReflection_of_parameterFreeInduction:
    forgive:
      # Quoted by Bek99 from Beklemishev 1997 without proof.
      - FFL.FirstOrder.Arithmetic.uniformReflection_of_parameterFreeInduction
  FFL.FirstOrder.Arithmetic.not_provable_infinitudeOfPrimes_IOpen:
    forgive:
      - FFL.FirstOrder.Arithmetic.not_provable_infinitudeOfPrimes_IOpen
  FFL.FirstOrder.Arithmetic.not_provable_primeDvdMul_IOpen:
    forgive:
      - FFL.FirstOrder.Arithmetic.not_provable_primeDvdMul_IOpen
  FFL.FirstOrder.Arithmetic.not_provable_bezout_IOpen_greatestCommonDivisor:
    forgive:
      - FFL.FirstOrder.Arithmetic.not_provable_bezout_IOpen_greatestCommonDivisor
  FFL.FirstOrder.Arithmetic.not_provable_IOpen_allClosure:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen
  FFL.FirstOrder.not_provable_irrationalSqrtTwo_IOpen:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen
  FFL.FirstOrder.Arithmetic.IOpen_strictlyWeakerThan_IOpen_bezout:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen
  HahnSeries.isRealClosed_lex:
    forgive:
      - HahnSeries.isRealClosed_lex
  FFL.FirstOrder.Arithmetic.exists_computable_nonstandard_model_IOpen:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_computable_nonstandard_model_IOpen
  FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen
  OpenPredicate.openInduction_iff_integerPart:
    forgive:
      - OpenPredicate.openInduction_iff_integerPart
  FFL.FirstOrder.Arithmetic.provable_translate_henkinTranslation:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_translate_henkinTranslation
  FFL.FirstOrder.Arithmetic.provable_diagonalRamseyTwoColours_PA:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_diagonalRamseyTwoColours_PA

  # Declarations that inherit the debt of an unproved statement.
  FFL.FirstOrder.not_provable_fermatLastTheorem_IOpen:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen
  FFL.FirstOrder.Arithmetic.not_provable_fermatLastTheoremCaseOne_IOpen_of_models_ZRing:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen
  FFL.FirstOrder.not_provable_fermatLastTheoremCaseOne_seven_IOpen:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen
  FFL.FirstOrder.exists_not_provable_fermatLastTheoremCaseOne_IOpen:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen
  FFL.FirstOrder.Arithmetic.provable_univCl_IOpen_iff:
    forgive:
      - FFL.FirstOrder.Arithmetic.exists_embedding_models_IOpen
  HahnSeries.factorialIntegerPartSubring.induction:
    forgive:
      - HahnSeries.isRealClosed_lex
  HahnSeries.factorialIntegerPartSubring.models:
    forgive:
      - HahnSeries.isRealClosed_lex
  FFL.FirstOrder.Arithmetic.IOpen.not_finiteAxiomatizable:
    forgive:
      - HahnSeries.isRealClosed_lex
  FFL.FirstOrder.Arithmetic.interpretable_union_singleton_neg_standardProvability_neg:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_translate_henkinTranslation
  FFL.FirstOrder.ArithmeticTheory.interpretability_consistency:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_translate_henkinTranslation
  FFL.InterpretabilityLogic.instILInterpretabilityAbstraction:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_translate_henkinTranslation
  FFL.InterpretabilityLogic.Logic.IL.arithmetical_soundness_interpretability:
    forgive:
      - FFL.FirstOrder.Arithmetic.provable_translate_henkinTranslation
