name: Repair the dependency bump

# `update-deps.yml` moves the pins only, so a bump that breaks this repository arrives red. This
# runs after that red CI run has finished, not inside it: Claude Code repairs the branch under
# `.claude/commands/update-deps.md`, and the push it makes starts the CI run that judges it. One
# attempt per bump, on the organization secret `ANTHROPIC_API_KEY`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Never cancelled halfway: that would leave the repair uncommitted.
concurrency:
  group: repair-deps
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRANCH: update-deps
  LABEL: update-deps
  # `update-deps.yml`'s commit subject: it marks the bump's own commit.
  TITLE: 'chore: Update dependencies'

jobs:
  repair:
    name: Repair the bump
    if: >-
      github.repository == 'FormalizedFormalLogic/AlphaCentauri'
      && github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_branch == 'update-deps'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # A `github.token` push starts no checks, so the repair pushes as the App too.
      - name: Mint the app token
        id: app-token
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Decide whether this bump is ours to repair
        id: decide
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh pr list --state open --label "$LABEL" --limit 1 --json number --jq '.[0].number // ""')
          if [ -z "$number" ]; then
            echo "no open pull request labelled $LABEL; nothing to repair"
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "the branch moved since that CI run; a later run will report on the new tip"
            exit 0
          fi
          # A commit on top of the pin is a previous repair; `--first-parent` ignores the merge
          # of `main` GitHub makes for the strict checks.
          pin=$(git log --grep="^$TITLE" -1 --format='%H')
          if [ -z "$pin" ]; then
            echo "no pin commit on the branch; leaving it alone"
            exit 0
          fi
          if [ "$(git rev-list --first-parent --no-merges --count "$pin..HEAD")" != 0 ]; then
            echo "this bump has already been repaired once and is still red; a human decides"
            gh pr comment "$number" --body \
              "The repair pushed for this bump did not make it green, and \`repair-deps.yml\` attempts each bump once. It is yours now; the next bump restarts the cycle."
            exit 0
          fi
          if [ -z "$KEY" ]; then
            echo "ANTHROPIC_API_KEY is not configured; leaving the bump to a human"
            gh pr comment "$number" --body \
              "This bump is red and \`ANTHROPIC_API_KEY\` is not configured, so no agent picked it up."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "repairing #$number at $(git rev-parse --short HEAD)"

      - uses: extractions/setup-just@v3
        if: steps.decide.outputs.number != ''
      - uses: leanprover/lean-action@v1
        if: steps.decide.outputs.number != ''
        with:
          build: false
          use-github-cache: false

      # The path and key are `ci.yml`'s and have to stay identical to it.
      - name: Restore the dependency build
        id: foundation-cache
        if: steps.decide.outputs.number != ''
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages/Foundation/.lake/build
          key: foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build the dependency from source (cache miss only)
        if: steps.decide.outputs.number != '' && steps.foundation-cache.outputs.cache-hit != 'true'
        run: |
          lake build Foundation
          python3 .github/scripts/clear-dep-warnings.py .lake/packages/Foundation/.lake/build

      - name: Configure the committer
        if: steps.decide.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          author=${APP_SLUG:+${APP_SLUG}[bot]}
          author=${author:-github-actions[bot]}
          git config user.name "$author"
          git config user.email "$(gh api "/users/${author//\[bot\]/%5Bbot%5D}" --jq .id)+$author@users.noreply.github.com"

      - name: Repair the branch
        if: steps.decide.outputs.number != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          claude_args: |
            --max-turns 120
            --model claude-sonnet-5
            --allowedTools Read,Edit,Write,Glob,Grep,Bash
          prompt: |
            The `${{ env.BRANCH }}` branch is checked out, its dependency layer is built, and CI
            is red. Repair this repository and push to the branch.
            `.claude/commands/update-deps.md` is the runbook; its steps 1 and 2 are done for you,
            and you stop at the push.

            Verify with `lake build AlphaCentauri --wfail`, `just mk-all`, `just no-sorry` and
            `just axiom-audit` before committing. Never force-push, never merge, never write
            `sorry`, and touch nothing under `docs/`, `.github/`, `README.md` or `AGENTS.md`.

            Say what you changed, or what is broken if you cannot get it green, in a comment on
            #${{ steps.decide.outputs.number }}. Push nothing that leaves the build red: this bump
            gets one attempt.

      - name: Cancel the queued merge if the agent pushed
        if: steps.decide.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          NUMBER: ${{ steps.decide.outputs.number }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" ]; then
            echo "the agent pushed nothing; the queued merge, if any, still stands"
            exit 0
          fi
          gh pr merge "$NUMBER" --disable-auto || true
          echo "#$NUMBER carries a repair now; its merge is a human's"
