name: Update dependencies

# Every six hours (and on demand) the pins of the package this repository follows are moved to
# the tip of its `master`, on one long-lived branch, `update-deps`, behind one pull request
# labelled `update-deps`. Only the pins move here: `repair-deps.yml` fixes what the move breaks in
# that same pull request, and a bump that breaks nothing merges itself (see docs/workflow.md).
# Which package is followed is the `env` block below and nothing else.
#
# Pushes made with `github.token` do not start `ci.yml`, and `main` requires its checks, so the
# branch and the pull request belong to a GitHub App instead: the organization variable
# `BOT_APP_ID` and the secret `BOT_APP_PRIVATE_KEY` (contents and pull requests: write; issues:
# write, for the label). Without them the workflow still runs under `github.token`, and the bump
# then has no checks until someone pushes to its branch.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# A run pushes to a shared branch, so runs never overlap; a scheduled run behind a manual one
# waits rather than dies, because it may carry a newer revision.
concurrency:
  group: update-deps
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: update-deps
  LABEL: update-deps
  # The Lake package followed on `master`, and the repository it is resolved from.
  PACKAGE: Foundation
  UPSTREAM: FormalizedFormalLogic/Foundation
  # Packages pinned by revision that read Lean's internals, so their pin moves with the toolchain.
  TOOLCHAIN_PINNED: Forgive

jobs:
  update:
    name: Bump the Foundation pins
    # Nothing to do in a fork, whose pull requests go to its own default branch.
    if: github.repository == 'FormalizedFormalLogic/AlphaCentauri'
    runs-on: ubuntu-latest
    steps:
      # An installation token, revoked when the job ends. Skipped, and `github.token` used, where
      # the app is not installed — a fork, or before the app exists.
      - name: Mint the app token
        id: app-token
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Full history: the existing branch is fetched below, and its tip is what the push leases.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      # One pull request carries the bump at a time; a second one would race this branch.
      - name: Find the open pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --label "$LABEL" --limit 1 --json number,headRefName)
          number=$(echo "$pr" | jq -r '.[0].number // ""')
          head=$(echo "$pr" | jq -r '.[0].headRefName // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head=${head:-$BRANCH}" >> "$GITHUB_OUTPUT"
          echo "found the pull request: ${number:-none} (branch ${head:-$BRANCH})"

      # An open pull request's branch is built on top of, never rewritten: an agent's fixes for
      # the previous bump live there. Without one, the branch restarts from `main`.
      - name: Prepare the branch
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            git fetch origin "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
            git switch --force-create "$HEAD_REF" "origin/$HEAD_REF"
          else
            git switch --force-create "$BRANCH" origin/main
          fi

      # `lean-toolchain` has to equal the upstream package's, and is taken before lake runs, so
      # that lake runs under the toolchain it is resolving for.
      - name: Take the upstream toolchain
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/$UPSTREAM/master/lean-toolchain" -o lean-toolchain
          echo "the toolchain is $(cat lean-toolchain)"

      # Lake builds every dependency under the root toolchain, so a package pinned by revision
      # has to move with it or it no longer compiles.
      - name: Move the pins tied to the toolchain
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          for package in $TOOLCHAIN_PINNED; do
            python3 .github/scripts/pin-to-toolchain.py lakefile.toml "$package" "$(cat lean-toolchain)"
          done

      # elan only. `lake exe cache get` would run against a tree whose `lean-toolchain` is
      # already the upstream's while `lake-manifest.json` still pins the old Mathlib, and the
      # cache refuses a toolchain mismatch — so it is turned off rather than left to
      # autodetection.
      - name: Install elan
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
          use-mathlib-cache: false

      # `lakefile.toml` follows the upstream `master`, so `lake update` is the rest of the bump:
      # it resolves that branch, and the pins moved above, into the manifest.
      - name: Update the manifest
        id: rev
        run: |
          set -euo pipefail
          pin() { jq -r --arg p "$PACKAGE" '.packages[] | select(.name == $p) | .rev' lake-manifest.json; }
          old=$(pin)
          # shellcheck disable=SC2086 # a list of package names, deliberately split
          lake update "$PACKAGE" $TOOLCHAIN_PINNED
          new=$(pin)
          {
            echo "old=$old"
            echo "new=$new"
            echo "short=${new:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "the branch pinned $old; it now pins $new"

      - name: Commit and push
        id: push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
          SHORT: ${{ steps.rev.outputs.short }}
        run: |
          set -euo pipefail
          # The commit is attributed to the identity that pushes it, whose noreply address is
          # built from the bot account's user id.
          author=${APP_SLUG:+${APP_SLUG}[bot]}
          author=${author:-github-actions[bot]}
          git config user.name "$author"
          git config user.email "$(gh api "/users/${author//\[bot\]/%5Bbot%5D}" --jq .id)+$author@users.noreply.github.com"
          if git diff --quiet -- lakefile.toml lake-manifest.json lean-toolchain; then
            echo "the pins did not move; nothing to push"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "deps($PACKAGE): Update to \`$SHORT\`" -- lakefile.toml lake-manifest.json lean-toolchain
          if [ -n "$PR_NUMBER" ]; then
            # Never a rewrite: the branch carries the fixes pushed for the previous bump.
            git push origin "HEAD:refs/heads/$HEAD_REF"
          else
            # No pull request points at the branch, so a leftover one is replaced, against the
            # tip fetched at checkout.
            git push --force-with-lease origin "HEAD:$BRANCH"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The title becomes the commit subject on `main`, so it names the revision that landed.
      - name: Open or refresh the pull request
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          NEW: ${{ steps.rev.outputs.new }}
          OLD: ${{ steps.rev.outputs.old }}
          SHORT: ${{ steps.rev.outputs.short }}
        run: |
          set -euo pipefail
          title="deps($PACKAGE): Update to \`$SHORT\`"
          body=$(cat <<EOF
          Pins $PACKAGE at \`$NEW\` ([compare](https://github.com/$UPSTREAM/compare/$OLD...$NEW)).

          Opened by \`.github/workflows/update-deps.yml\`, which moves the pins only. This body is rewritten on every run; leave notes in a comment.
          EOF
          )
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --label "$LABEL" --title "$title" --body "$body"
          fi

      # A pins-only bump has no diff to read, so its checks are the whole review: the merge is
      # queued here and GitHub performs it once they are green. `repair-deps.yml` cancels it when
      # the branch stops being pins-only.
      - name: Queue the merge of a pins-only bump
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          number=$(gh pr list --state open --label "$LABEL" --limit 1 --json number --jq '.[0].number // ""')
          if [ -z "$number" ]; then
            echo "no open pull request to queue"
            exit 0
          fi
          extra=$(git diff --name-only origin/main...HEAD |
            grep -vxE 'lake-manifest\.json|lakefile\.toml|lean-toolchain' || true)
          if [ -n "$extra" ]; then
            echo "the branch also changes:"
            echo "$extra"
            echo "the merge of #$number stays a human's"
            exit 0
          fi
          gh pr merge "$number" --squash --auto
          echo "queued the merge of #$number; GitHub performs it once the checks are green"
